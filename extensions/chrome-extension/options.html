<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Chrome Bridge</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 7px 9px; box-sizing: border-box; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; }
      button { margin: 16px 8px 0 0; padding: 7px 14px; border-radius: 6px; border: 1px solid #8886; background: #2b6cb0; color: #fff; cursor: pointer; }
      button.secondary { background: transparent; color: inherit; }
      #status { margin-top: 14px; padding: 9px 11px; border-radius: 6px; background: #8881; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      .muted { opacity: .7; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>DSH Chrome Bridge</h1>
    <p class="muted">
      把扩展连接到本机 DSH 的 chrome-bridge 插件（默认 127.0.0.1:47835）。改完点「保存并重连」。
    </p>
    <label for="port">端口</label>
    <input id="port" type="number" min="1" max="65535" />
    <label for="token">配对 token</label>
    <input id="token" type="text" />
    <div>
      <button id="save">保存并重连</button>
      <button id="test" class="secondary">测试连接</button>
    </div>
    <div id="status">尚未测试</div>
    <script src="options.js"></script>
  </body>
</html>
